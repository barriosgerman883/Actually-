name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Security tests
        run: pnpm test:security
      - name: Architecture tests
        run: pnpm test:architecture
      - name: Build
        run: pnpm build
      # Runs the compiled CLI, which no unit test does (F-49): offline, with
      # empty home, state, cache and config directories, so nothing leaves
      # the runner. On Windows, Node.js needs Windows paths.
      - name: Smoke test of the built CLI
        run: |
          tmp() { local d; d="$(mktemp -d)"; if command -v cygpath >/dev/null; then cygpath -w "$d"; else echo "$d"; fi; }
          export HOME="$(tmp)" USERPROFILE="$(tmp)" LOCALAPPDATA="$(tmp)" APPDATA="$(tmp)"
          export XDG_STATE_HOME="$(tmp)" XDG_CACHE_HOME="$(tmp)" XDG_CONFIG_HOME="$(tmp)"
          node dist/cli/index.js status --offline --json > "$RUNNER_TEMP/status.json"
          jq -e '.schemaVersion == 1 and (.diagnostics | type == "array")' "$RUNNER_TEMP/status.json"
          set +e
          node dist/cli/index.js --no-such-flag
          test $? -eq 2
      # The MCP server over real stdio, offline: the handshake, the tool
      # list, a tool call and a stateless discover (ADR 0010). jq -s also
      # fails if stdout carries anything that is not a JSON message.
      - name: Smoke test of the MCP server
        run: |
          tmp() { local d; d="$(mktemp -d)"; if command -v cygpath >/dev/null; then cygpath -w "$d"; else echo "$d"; fi; }
          export HOME="$(tmp)" USERPROFILE="$(tmp)" LOCALAPPDATA="$(tmp)" APPDATA="$(tmp)"
          export XDG_STATE_HOME="$(tmp)" XDG_CACHE_HOME="$(tmp)" XDG_CONFIG_HOME="$(tmp)"
          modern='"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}'
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"status","arguments":{"offline":false}}}' \
            "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"server/discover\",\"params\":{$modern}}" \
            | node dist/cli/index.js mcp --offline > "$RUNNER_TEMP/mcp.jsonl"
          jq -s -e '
            (map({key: (.id | tostring), value: .}) | from_entries) as $r
            | length == 4
            and $r["1"].result.protocolVersion == "2025-11-25"
            and ([$r["2"].result.tools[].name] == ["status", "explain"])
            and ($r["3"].result.content[0].text | fromjson | .schemaVersion == 1 and (.diagnostics | type == "array"))
            and ($r["4"].result.supportedVersions | index("2026-07-28") != null)
          ' "$RUNNER_TEMP/mcp.jsonl"
      # npm global packages and tools on PATH with a real npm
      # (docs/providers/npm.md, ADR 0011): a package installed into a
      # temporary prefix in PATH must appear as npm's, git as a tool on PATH,
      # and no two records may share an id.
      - name: Global view with a real npm
        run: |
          tmp() { local d; d="$(mktemp -d)"; if command -v cygpath >/dev/null; then cygpath -w "$d"; else echo "$d"; fi; }
          export HOME="$(tmp)" USERPROFILE="$(tmp)" LOCALAPPDATA="$(tmp)" APPDATA="$(tmp)"
          export XDG_STATE_HOME="$(tmp)" XDG_CACHE_HOME="$(tmp)" XDG_CONFIG_HOME="$(tmp)"
          prefix="$(tmp)"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund semver@7.6.3
          if command -v cygpath >/dev/null; then export PATH="$(cygpath -u "$prefix"):$PATH"; else export PATH="$prefix/bin:$PATH"; fi
          node dist/cli/index.js status --global --offline --json > "$RUNNER_TEMP/global-view.json"
          jq -e '
            ([.tools[] | select(.name == "semver" and .installation.value.provider == "npm") | .versions.installed.value] | index("7.6.3") != null)
            and any(.tools[]; .name == "git")
            and ([.diagnostics[] | select(.message | test("share the id"))] == [])
          ' "$RUNNER_TEMP/global-view.json"
      # On Windows, pnpm is a .cmd launcher that actually reads instead of
      # running (ADR 0009). A real global package must show up.
      - name: Global packages with a real pnpm on Windows
        if: runner.os == 'Windows'
        run: |
          tmp() { cygpath -w "$(mktemp -d)"; }
          export PNPM_HOME="$(tmp)" LOCALAPPDATA="$(tmp)" APPDATA="$(tmp)" USERPROFILE="$(tmp)"
          # pnpm 10 puts global bins in PNPM_HOME, pnpm 11 and later in PNPM_HOME\bin.
          export PATH="$(cygpath -u "$PNPM_HOME")/bin:$(cygpath -u "$PNPM_HOME"):$PATH"
          work="$(mktemp -d)"
          (cd "$work" && pnpm add -g is-number@6.0.0)
          (cd "$work" && node "$GITHUB_WORKSPACE/dist/cli/index.js" status --global --offline --json) > "$RUNNER_TEMP/global.json"
          jq '.diagnostics' "$RUNNER_TEMP/global.json"
          jq -e '[.tools[] | select(.id == "global:pnpm:is-number") | .versions.installed.value] == ["6.0.0"]' "$RUNNER_TEMP/global.json"
      - name: Dependency audit
        if: runner.os == 'Linux'
        run: pnpm audit --prod
