name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Security tests
        run: pnpm test:security
      - name: Architecture tests
        run: pnpm test:architecture
      - name: Build
        run: pnpm build
      # Runs the compiled CLI, which no unit test does (F-49): offline, with
      # empty home and XDG directories, so nothing leaves the runner.
      - name: Smoke test of the built CLI
        run: |
          export HOME="$(mktemp -d)" XDG_STATE_HOME="$(mktemp -d)" XDG_CACHE_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)"
          node dist/cli/index.js status --offline --json > "$RUNNER_TEMP/status.json"
          jq -e '.schemaVersion == 1 and (.diagnostics | type == "array")' "$RUNNER_TEMP/status.json"
          set +e
          node dist/cli/index.js --no-such-flag
          test $? -eq 2
      - name: Dependency audit
        run: pnpm audit --prod
