name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Security tests
        run: pnpm test:security
      - name: Architecture tests
        run: pnpm test:architecture
      - name: Build
        run: pnpm build
      # Runs the compiled CLI, which no unit test does (F-49): offline, with
      # empty home, state, cache and config directories, so nothing leaves
      # the runner. On Windows, Node.js needs Windows paths.
      - name: Smoke test of the built CLI
        run: |
          tmp() { local d; d="$(mktemp -d)"; if command -v cygpath >/dev/null; then cygpath -w "$d"; else echo "$d"; fi; }
          export HOME="$(tmp)" USERPROFILE="$(tmp)" LOCALAPPDATA="$(tmp)" APPDATA="$(tmp)"
          export XDG_STATE_HOME="$(tmp)" XDG_CACHE_HOME="$(tmp)" XDG_CONFIG_HOME="$(tmp)"
          node dist/cli/index.js status --offline --json > "$RUNNER_TEMP/status.json"
          jq -e '.schemaVersion == 1 and (.diagnostics | type == "array")' "$RUNNER_TEMP/status.json"
          set +e
          node dist/cli/index.js --no-such-flag
          test $? -eq 2
      # On Windows, pnpm is a .cmd launcher that actually reads instead of
      # running (ADR 0009). A real global package must show up.
      - name: Global packages with a real pnpm on Windows
        if: runner.os == 'Windows'
        run: |
          tmp() { cygpath -w "$(mktemp -d)"; }
          export PNPM_HOME="$(tmp)" LOCALAPPDATA="$(tmp)" APPDATA="$(tmp)" USERPROFILE="$(tmp)"
          # pnpm 10 puts global bins in PNPM_HOME, pnpm 11 and later in PNPM_HOME\bin.
          export PATH="$(cygpath -u "$PNPM_HOME")/bin:$(cygpath -u "$PNPM_HOME"):$PATH"
          work="$(mktemp -d)"
          (cd "$work" && pnpm add -g is-number@6.0.0)
          (cd "$work" && node "$GITHUB_WORKSPACE/dist/cli/index.js" status --global --offline --json) > "$RUNNER_TEMP/global.json"
          jq '.diagnostics' "$RUNNER_TEMP/global.json"
          jq -e '[.tools[] | select(.id == "global:pnpm:is-number") | .versions.installed.value] == ["6.0.0"]' "$RUNNER_TEMP/global.json"
      - name: Dependency audit
        if: runner.os == 'Linux'
        run: pnpm audit --prod
